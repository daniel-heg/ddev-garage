name: garage

project_files:
  - docker-compose.garage.yaml
  - garage/ensure-public-bucket
  - commands/host/garage

global_files: []

ddev_version_constraint: ">= v1.25.2"

post_install_actions:
  - |
    #ddev-description:Generate project-specific Garage configuration
    set -eu

    bucket="${GARAGE_DEFAULT_BUCKET:-garage}"

    if ! printf '%s' "${bucket}" | grep -Eq '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'; then
      echo "GARAGE_DEFAULT_BUCKET must be a 3-63 character lowercase DNS label." >&2
      exit 1
    fi

    for template in \
      "${DDEV_APPROOT}/.ddev/config.garage.yaml.template" \
      "${DDEV_APPROOT}/.ddev/garage/garage.toml.template"
    do
      if [ -f "${template}" ] && grep -q '#ddev-generated' "${template}"; then
        rm -f "${template}"
      fi
    done

    cat > "${DDEV_APPROOT}/.ddev/garage/garage.toml" <<EOF
    #ddev-generated
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage:3901"
    rpc_secret = "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    root_domain = ".${DDEV_SITENAME}.${DDEV_TLD}"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".${DDEV_SITENAME}.${DDEV_TLD}"

    [admin]
    api_bind_addr = "[::]:3903"
    EOF

    cat > "${DDEV_APPROOT}/.ddev/config.garage.yaml" <<EOF
    #ddev-generated
    #ddev-silent-no-warn
    additional_hostnames:
      - ${bucket}.${DDEV_SITENAME}

    hooks:
      post-start:
        - exec-host: bash "\${DDEV_APPROOT}/.ddev/garage/ensure-public-bucket"
    EOF

    chmod +x \
      "${DDEV_APPROOT}/.ddev/commands/host/garage" \
      "${DDEV_APPROOT}/.ddev/garage/ensure-public-bucket"

removal_actions:
  - |
    #ddev-description:Remove generated Garage runtime configuration
    for file in \
      "${DDEV_APPROOT}/.ddev/config.garage.yaml" \
      "${DDEV_APPROOT}/.ddev/garage/garage.toml" \
      "${DDEV_APPROOT}/.ddev/config.garage.yaml.template" \
      "${DDEV_APPROOT}/.ddev/garage/garage.toml.template"
    do
      if [ ! -f "${file}" ]; then
        continue
      fi

      if grep -q '#ddev-generated' "${file}"; then
        rm -f "${file}"
      else
        echo "Preserving modified file: ${file}"
      fi
    done

    rmdir "${DDEV_APPROOT}/.ddev/garage" 2>/dev/null || true
